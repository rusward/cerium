name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the compiler
        run: python -m pip install -e .

      - name: Check the installed CLI
        run: ceriumc --version

      - name: Run the test suite
        run: python -m unittest discover -s tests -v

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the compiler
        run: python -m pip install -e .

      - name: Check the installed CLI
        run: ceriumc --version

      - name: Show the C compiler
        run: clang --version

      - name: Run the test suite
        run: python -m unittest discover -s tests -v

  windows:
    name: Windows / MinGW
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up MSYS2 and MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit

      - name: Install the compiler
        run: python -m pip install -e .

      - name: Check the installed CLI
        run: ceriumc --version

      - name: Show the C compiler
        run: gcc --version

      - name: Run the test suite
        run: python -m unittest discover -s tests -v
